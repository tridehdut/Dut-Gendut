name: Build Finance Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak project Android
        run: |
          rm -rf project
          mkdir project
          unzip -q Finance_Control_Android_Project.zip -d project

      - name: Cari project Android
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan"
            find project -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Finance-Control-APK
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
